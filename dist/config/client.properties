# Cau hinh CLIENT (./config/client.properties)
# Dien san IP Tailscale/ZeroTier cua may chay Server (vd 100.x.y.z)
server.host=127.0.0.1
server.port=5555
# KHOA AES: phai GIONG server.properties
aes.secret=Nhom08-GroupChat-AES-Secret
# Ma hoa kenh truyen TLS (phai khop server.properties). Lan dau ket noi Client tu ghi nho van tay chung chi cua Server
# vao config/known_servers.properties; van tay doi => tu choi (chong gia mao). Muon ghim cung thi dien van tay vao day:
tls.enabled=true
server.fingerprint=
# Tu dong ket noi lai khi mat mang
reconnect.enabled=true
reconnect.max.attempts=40
