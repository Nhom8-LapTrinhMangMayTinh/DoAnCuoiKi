# Cau hinh SERVER (dat canh thu muc chay: ./config/server.properties)
port=5555
# SQLite: file se tu tao. Doi duong dan neu muon.
db.url=jdbc:sqlite:data/chat.db
files.dir=data/files
log.file=data/server.log
# KHOA AES dung chung: phai GIONG HET trong client.properties cua moi may
aes.secret=Nhom08-GroupChat-AES-Secret

# ---------- Ma hoa kenh truyen (TLS) ----------
# Bat TLS: moi du lieu Client<->Server (ke ca mat khau) duoc ma hoa. Keystore tu sinh bang keytool neu chua co.
tls.enabled=true
tls.keystore=config/server.p12
tls.password=groupchat

# ---------- Tai khoan & phien ----------
# Tai khoan quan tri Server. Neu chua ton tai Server tao moi voi mat khau ngau nhien (in ra console + data/admin-credentials.txt)
admin.users=admin
# admin.password=   (bo comment de tu dat mat khau thay vi ngau nhien)
password.min.length=6
# Tu dang xuat neu khong thao tac sau N phut
session.idle.min=30
# Token ket noi lai khong can mat khau song bao lau (phut) ke tu lan hoat dong cuoi
session.token.min=15
# Phien khong co du lieu sau N giay duoc coi la da chet va bi thay the khi dang nhap lai
session.stale.sec=25
# Dang nhap sai N lan -> khoa tai khoan do M giay
login.max.fail=5
login.lock.sec=60
read.timeout.sec=60

# ---------- File ----------
# Gioi han dung luong 1 file (MB)
max.file.mb=1024
# Chan loai file nguy hiem. Neu dat file.allowed.ext thi CHI cho phep cac loai do.
file.blocked.ext=exe,bat,cmd,com,scr,msi,vbs,ps1,dll,jar,js,sh
file.allowed.ext=

# ---------- Chong spam ----------
# Qua spam.max.msgs tin trong spam.window.sec giay, hoac lap lai cung noi dung > spam.max.repeat lan => han che spam.mute.sec giay
spam.max.msgs=10
spam.window.sec=5
spam.max.repeat=4
spam.mute.sec=30
